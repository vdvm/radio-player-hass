name: Radio Player
version: "0.1.0"
slug: radio_player
description: Offers radio stations to Home Assistant and, for the one you listen to, the stream URL and what is playing, via MQTT
url: https://github.com/vdvm/radio-player-hass
arch:
  - aarch64
  - amd64
image: ghcr.io/vdvm/radio-player-app
init: false
startup: services
boot: auto
services:
  - mqtt:need
options:
  stations:
    - id: bbc_radio_one
      name: "BBC Radio 1"
      source: "bbc:bbc_radio_one"
    - id: bbc_radio_one_dance
      name: "BBC Radio 1 Dance"
      source: "bbc:bbc_radio_one_dance"
    - id: capital
      name: "Capital"
      source: "capital:uk"
    - id: capital_london
      name: "Capital London"
      source: "capital:london"
    - id: capital_chill
      name: "Capital Chill"
      source: "capital:chill"
    - id: capital_dance
      name: "Capital Dance"
      source: "capital:dance"
  now_playing_seconds: 10
  log_level: info
schema:
  stations:
    - id: match(^[a-z0-9_]{1,64}$)
      name: str(1,100)
      source: str
  now_playing_seconds: int(10,3600)
  log_level: list(error|warn|info|debug)?
